<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenArt Refs</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/naver/d2codingfont@latest/dist/D2Coding.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-root">
    <header class="site-header">
      <div class="header-left">
        <div class="logo-icon">
          <span class="material-symbols-outlined">palette</span>
        </div>
        <h1 class="site-title">Generative Art References</h1>
      </div>
    </header>

    <main class="site-main">
      <div class="content-wrap">

        <section class="hero">
          <h1 class="hero-title">
            <span class="accent">코딩 아트</span>와<br />
            <span class="accent">제너레이티브 아트</span><br />
            참고자료 모음
          </h1>
          <p class="hero-desc">
            영감을 주는 크리에이티브 코딩 및 제너레이티브 아트 웹사이트들을 엄선했습니다. 
          </p>
          <div class="hero-bar"></div>
        </section>

        <section class="controls">
          <h2 class="section-title">
            ARCHIVED WEBSITES
          </h2>

          <div class="sort-buttons">
            <button id="btn-sort-recommended">JaiKim 추천</button>
            <button id="btn-sort-alpha">알파벳순</button>
            <button id="btn-sort-random">네가 골라줘</button>
          </div>

          <div class="search-box">
            <span class="material-symbols-outlined">search</span>
            <input id="search-input" type="text" placeholder="설명글과 제목 검색..." />
          </div>
        </section>

        <div id="resource-list"></div>
        <div id="no-results" class="hidden">검색 결과가 없습니다.</div>

        <div id="load-more-container" class="load-more hidden">
          <button id="btn-load-more">
            <span class="material-symbols-outlined">refresh</span>
            더 불러오기
          </button>
        </div>

      </div>
    </main>

    <footer class="site-footer">
      <p>ⓒ 2026 JaiKim & Semyung Univ. All rights reserved</p>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
